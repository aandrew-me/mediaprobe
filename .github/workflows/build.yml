name: Build Desktop Installers

on:
  push:
    branches: [release]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Platform to build"
        type: choice
        default: "all"
        options:
          - all
          - windows
          - macos
          - linux
      create_release:
        description: "Create a draft GitHub Release with built installers"
        type: boolean
        default: false
      release_tag:
        description: "Release tag name (e.g. v0.1.0, optional)"
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Windows Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\mediaprobe.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\mediaprobe.exe dist\mediaprobe-windows-x86_64.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mediaprobe-windows-x86_64
          path: |
            dist/MediaProbe-Setup-x86_64.exe
            dist/mediaprobe-windows-x86_64.exe

  macos:
    name: macOS (Universal)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build Universal macOS binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist/dmg_root/MediaProbe.app/Contents/MacOS
          mkdir -p dist/dmg_root/MediaProbe.app/Contents/Resources
          lipo -create \
            target/aarch64-apple-darwin/release/mediaprobe \
            target/x86_64-apple-darwin/release/mediaprobe \
            -output dist/dmg_root/MediaProbe.app/Contents/MacOS/mediaprobe
          cp packaging/macos/Info.plist dist/dmg_root/MediaProbe.app/Contents/Info.plist
          cp assets/icon.icns dist/dmg_root/MediaProbe.app/Contents/Resources/AppIcon.icns
          ln -s /Applications dist/dmg_root/Applications
          hdiutil create -volname "MediaProbe" -srcfolder dist/dmg_root -ov -format UDZO dist/MediaProbe-macOS-Universal.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: mediaprobe-macos-universal
          path: dist/MediaProbe-macOS-Universal.dmg

  linux:
    name: Linux (x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies for GPUI & rfd
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package .deb and .tar.gz
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -n1 | cut -d'"' -f2)
          PKG_DIR="dist/mediaprobe_${VERSION}_amd64"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/applications"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"

          cp target/release/mediaprobe "$PKG_DIR/usr/bin/mediaprobe"
          chmod 755 "$PKG_DIR/usr/bin/mediaprobe"
          cp packaging/linux/mediaprobe.desktop "$PKG_DIR/usr/share/applications/mediaprobe.desktop"
          cp assets/icon.svg "$PKG_DIR/usr/share/icons/hicolor/scalable/apps/mediaprobe.svg"
          cp assets/icon.png "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/mediaprobe.png"

          printf 'Package: mediaprobe\nVersion: %s\nSection: video\nPriority: optional\nArchitecture: amd64\nDepends: libc6, libfontconfig1, libgtk-3-0, libvulkan1\nMaintainer: MediaProbe\nDescription: Standalone desktop media inspector built with Rust and GPUI\n' "${VERSION}" > "$PKG_DIR/DEBIAN/control"

          dpkg-deb --build "$PKG_DIR"
          tar -czf "dist/mediaprobe-linux-x86_64.tar.gz" -C target/release mediaprobe

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mediaprobe-linux-x86_64
          path: |
            dist/*.deb
            dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [windows, macos, linux]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('v0.1.0-build.{0}', github.run_number)) }}
          draft: true
          files: artifacts/**/*
