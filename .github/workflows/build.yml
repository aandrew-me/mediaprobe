name: Build Desktop Installers

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Build Windows Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\mediaprobe.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediaprobe-windows-x86_64
          path: |
            dist/MediaProbe-Setup-x86_64.exe
            target/release/mediaprobe.exe

  macos:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build Universal macOS binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist/dmg_root/MediaProbe.app/Contents/MacOS
          mkdir -p dist/dmg_root/MediaProbe.app/Contents/Resources
          lipo -create \
            target/aarch64-apple-darwin/release/mediaprobe \
            target/x86_64-apple-darwin/release/mediaprobe \
            -output dist/dmg_root/MediaProbe.app/Contents/MacOS/mediaprobe
          cp packaging/macos/Info.plist dist/dmg_root/MediaProbe.app/Contents/Info.plist
          cp assets/icon.icns dist/dmg_root/MediaProbe.app/Contents/Resources/AppIcon.icns
          ln -s /Applications dist/dmg_root/Applications
          hdiutil create -volname "MediaProbe" -srcfolder dist/dmg_root -ov -format UDZO dist/MediaProbe-macOS-Universal.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaprobe-macos-universal
          path: dist/MediaProbe-macOS-Universal.dmg

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies for GPUI & rfd
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Package .deb and .tar.gz
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -n1 | cut -d'"' -f2)
          PKG_DIR="dist/mediaprobe_${VERSION}_amd64"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/applications"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"

          cp target/release/mediaprobe "$PKG_DIR/usr/bin/mediaprobe"
          chmod 755 "$PKG_DIR/usr/bin/mediaprobe"
          cp packaging/linux/mediaprobe.desktop "$PKG_DIR/usr/share/applications/mediaprobe.desktop"
          cp assets/icon.svg "$PKG_DIR/usr/share/icons/hicolor/scalable/apps/mediaprobe.svg"
          cp assets/icon.png "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/mediaprobe.png"

          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: mediaprobe
          Version: ${VERSION}
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: libc6, libfontconfig1, libgtk-3-0, libvulkan1
          Maintainer: MediaProbe
          Description: Standalone desktop media inspector built with Rust and GPUI
          EOF

          dpkg-deb --build "$PKG_DIR"
          tar -czf "dist/mediaprobe-linux-x86_64.tar.gz" -C target/release mediaprobe

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediaprobe-linux-x86_64
          path: |
            dist/*.deb
            dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
