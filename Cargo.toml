[package]
name = "mediaprobe"
version = "0.1.1"
edition = "2021"
build = "build.rs"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
gpui = "0.2.2"
symphonia = { version = "0.6.1", default-features = false, features = ["all-meta", "aac", "aiff", "alac", "caf", "flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
mp4 = "0.14.0"
matroska = "0.30.1"
imagesize = "0.13"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
embed-resource = "3.0"
